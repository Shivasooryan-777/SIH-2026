python_interpreter = "d:/sih/backend/venv/Scripts/python.exe"
venv = "d:/sih/backend/venv"
search-paths = [
  "backend",
  "backend/venv/Lib/site-packages",
  "d:/sih/backend",
  "d:/sih/backend/venv/Lib/site-packages"
]
